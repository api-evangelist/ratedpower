name: RatedPower
description: >-
  RatedPower, part of Enverus (ENVERUS RATEDPOWER S.L.U., Madrid, Spain), is a
  cloud software platform for the design and engineering of utility-scale
  renewable energy projects. Its pvDesign product automates solar photovoltaic
  (PV) plant layout, energy-yield simulation, battery energy storage system
  (BESS) and hybrid plant design, substation and grid-connection engineering,
  earthwork estimating, and bankable proposal documentation. The platform is
  delivered as a browser-based SaaS application (login at ratedpower.enverus.com)
  and reports 64,000+ projects designed and 5.1 TW of simulated capacity. No
  public developer API, OpenAPI definition, SDK, or developer portal is
  published; enterprise automation access exists only behind the authenticated
  application. This profile was seeded as a Techstars portfolio lead and has been
  run through the API Evangelist enrichment pipeline.
